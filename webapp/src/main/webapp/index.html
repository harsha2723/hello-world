<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Images on a Bus</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
            background-color: #2c3e50; /* Dark background */
        }

        .header {
            text-align: center;
            color: #fff;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 36px;
            font-weight: 700;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.6);
        }

        .bus {
            position: relative;
            width: 100%;
            max-width: 1200px;
            background-color: #ffdd57; /* Yellow bus color */
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            margin-top: 20px;
        }

        .bus::before {
            content: "";
            position: absolute;
            top: -30px; /* Adjust the height of the bus front */
            left: 20px;
            right: 20px;
            height: 30px;
            background-color: #2c3e50; /* Dark top for bus windshield */
            border-radius: 10px 10px 0 0;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin: 0;
            padding: 10px 0;
        }

        .image-container {
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        .image-container:hover {
            transform: scale(1.05);
        }

        img {
            width: 100%;
            height: auto; /* Maintain aspect ratio */
            object-fit: cover; /* Ensures images fill the container */
        }

        footer {
            margin-top: 20px;
            color: #fff;
            text-align: center;
            font-size: 14px;
        }

        footer a {
            color: #ffdd57;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Images on a Bus</h1>
    </div>

    <div class="bus">
        <div class="gallery">
            <div class="image-container">
                <img src="Amal-new.JPEG" alt="Amal">
            </div>
            <div class="image-container">
                <img src="ashwin.JPEG" alt="Ashwin">
            </div>
            <div class="image-container">
                <img src="Krishna-Priya.JPEG" alt="Krishnapriya">
            </div>
            <div class="image-container">
                <img src="Nizma-new.JPEG" alt="Nizma">
            </div>
            <div class="image-container">
                <img src="Samyukth-new.JPEG" alt="Samyukth">
            </div>
            <div class="image-container">
                <img src="sara-new.JPEG" alt="Sara">
            </div>
            <div class="image-container">
                <img src="surya.JPEG" alt="Surya">
            </div>
        </div>
    </div>

    <footer>
        &copy; 2024 Images on a Bus | <a href="#">Privacy Policy</a> | <a href="#">Terms of Use</a>
    </footer>

</body>
</html>
