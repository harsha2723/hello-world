<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
    <style>
        body {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            margin: 20px;
        }
        .image-container {
            margin: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            overflow: hidden;
        }
        img {
            width: 200px; /* Set your desired width */
            height: auto;
        }
    </style>
</head>
<body>
    <div class="image-container">
        <img src="Amal-new.JPEG" alt="Image 1">
    </div>
    <div class="image-container">
        <img src="ashwin.JPEG" alt="Image 2">
    </div>
    <div class="image-container">
        <img src="Krishna-Priya.JPEG" alt="Image 3">
    </div>
    <div class="image-container">
        <img src="Nizma-new.JPEG" alt="Image 4">
    </div>
    <div class="image-container">
        <img src="Samyukth-new.JPEG" alt="Image 5">
    </div>
    <div class="image-container">
        <img src="sara-new.JPEG" alt="Image 6">
    </div>
    <div class="image-container">
        <img src="surya.JPEG" alt="Image 7">
    </div>
</body>
</html>
