<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manjummel Boys Poster</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
            background-color: #2c3e50; /* Dark background */
        }

        .header {
            text-align: center;
            color: #fff;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 36px;
            font-weight: 700;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.6);
        }

        .header p {
            font-size: 20px;
            font-weight: 300;
            margin-top: 10px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            max-width: 1200px;
            width: 100%;
        }

        .image-container {
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        .image-container:hover {
            transform: scale(1.05);
        }

        img {
            width: 100%;
            height: 200px; /* Set a fixed height for uniformity */
            object-fit: cover; /* Ensures images fill the container without distortion */
        }

        footer {
            margin-top: 20px;
            color: #fff;
            text-align: center;
            font-size: 14px;
        }

        footer a {
            color: #ffdd57;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Manjummel Boys</h1>
        <p>Featuring Our Amazing Cast</p>
    </div>

    <div class="gallery">
        <div class="image-container">
            <img src="Amal-new.JPEG" alt="Amal">
        </div>
        <div class="image-container">
            <img src="ashwin.JPEG" alt="Ashwin">
        </div>
        <div class="image-container">
            <img src="Krishna-Priya.JPEG" alt="Krishnapriya">
        </div>
        <div class="image-container">
            <img src="Nizma-new.JPEG" alt="Nizma">
        </div>
        <div class="image-container">
            <img src="Samyukth-new.JPEG" alt="Samyukth">
        </div>
        <div class="image-container">
            <img src="sara-new.JPEG" alt="Sara">
        </div>
        <div class="image-container">
            <img src="surya.JPEG" alt="Surya">
        </div>
    </div>

    <footer>
        &copy; 2024 Manjummel Boys | <a href="#">Privacy Policy</a> | <a href="#">Terms of Use</a>
    </footer>

</body>
</html>
